pr: none
trigger:
  branches:
    include:
      - main
schedules:
- cron: "0 0 * * *"
  displayName: Daily midnight build
  branches:
    include:
    - main

stages:
  - stage: SyncWikiStage
    displayName: Sync Wiki
    pool: 1es-ubuntu-22.04-x64
    jobs:
      - job: SyncWikiJob
        displayName: Sync Wiki
        steps:
          - checkout: self
            persistCredentials: true

          - script: |
              set -e
              wiki_url=https://github.com/Microsoft/vscode.wiki.git
              checkout_header=$(git config --local --get-urlmatch http.extraHeader "$(git remote get-url origin)")

              wiki_git() {
                WIKI_AUTH_HEADER="$checkout_header" git --config-env="http.${wiki_url}.extraHeader=WIKI_AUTH_HEADER" "$@"
              }

              git config user.email "vscode@microsoft.com"
              git config user.name "VSCode"
              git remote add upstream "$wiki_url"

              wiki_git fetch upstream

              echo 'Merging in vscode.wiki'
              git merge upstream/master

              echo 'Pushing to vscode-wiki'
              git push origin HEAD:$(Build.SourceBranch)

              echo 'Pushing to vscode.wiki'
              wiki_git push upstream HEAD:master

              echo 'Done!'
            displayName: Sync vscode-wiki & vscode.wiki
